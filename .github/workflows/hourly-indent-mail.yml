name: Hourly indent e-mail

# Exact times: cron-job.org starts this workflow (workflow_dispatch) at 7:54 and
# 8:54 IST; the job wakes the app, waits until 8:00:00 / 9:00:00 and opens
# ?hourly=run, so the production e-mail leaves on the hour.
# Backup: GitHub's own schedule every hour 8 AM-2 PM IST (often late). The app
# sends only at its send hours (8 and 9 AM) and each slot once (Mail_Log), so
# extra runs do nothing. "Run workflow" = a manual run.
on:
  schedule:
    - cron: "30 2-8 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Open the app so it sends this hour's e-mail
        run: python scripts/wake_and_send.py https://indent-salesapp.streamlit.app
