name: Hourly indent e-mail

# Every hour from 8:00 AM to 2:00 PM IST (02:30-08:30 UTC). The job opens the
# live app with ?hourly=run; the app sends that hour's e-mail with its own
# Streamlit secrets (no secrets are needed in GitHub). Each hour is sent once
# (Mail_Log), and nothing is sent outside 8 AM-2 PM. "Run workflow" = a test run.
on:
  schedule:
    - cron: "30 2-8 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Open the app so it sends this hour's e-mail
        run: python scripts/wake_and_send.py https://indent-salesapp.streamlit.app
